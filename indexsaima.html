<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A little surprise for you</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0b2e;--ink:#1a0b2e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden;background:var(--bg)}
.slide,#gate{background:var(--bg);color:var(--fg)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:12vh 7vw 15vh;text-align:center;opacity:0;visibility:hidden;transition:opacity .35s}
.slide.on{opacity:1;visibility:visible}
.slide>*{opacity:0}
.slide.on>*{animation:up .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.65s)}
@keyframes up{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
.slide.on>.e{animation:up .7s forwards,bob 2.4s ease-in-out .9s infinite;animation-delay:0s,.9s}
.e{font-size:15vh;line-height:1}
h2{font-size:clamp(24px,7.5vw,34px);font-weight:800;line-height:1.15}
h1{font-family:Pacifico,cursive;font-weight:400;color:#fff;font-size:clamp(50px,18vw,90px);line-height:1.1;text-shadow:4px 4px 0 var(--ink)}
p{background:#fff;color:var(--ink);padding:1.3vh 5vw;border-radius:16px;font-size:clamp(15px,4.4vw,20px);font-weight:500;line-height:1.35;box-shadow:4px 4px 0 var(--sh,var(--ink))}
.count .n{position:absolute;font-size:36vh;font-weight:800}
.slide.count.on>.n{animation:pop 1s both;animation-delay:calc(var(--i)*1s)}
@keyframes pop{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
#bars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:5}
#bars b{flex:1;height:4px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden}
#bars i{display:block;height:100%;width:0;background:#fff}
#bars .done i{width:100%}
#bars .act i{animation:fill var(--d) linear forwards}
@keyframes fill{to{width:100%}}
button{font:inherit;font-weight:800;border:0;border-radius:99px;padding:14px 30px;background:var(--fg);color:var(--bg);font-size:17px;cursor:pointer;box-shadow:4px 4px 0 var(--sh,var(--ink))}
#mute{position:absolute;top:24px;right:12px;z-index:6;width:34px;height:34px;padding:0;background:rgba(0,0,0,.28);color:#fff;font-size:16px;box-shadow:none;display:none}
#gate{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:8vw;text-align:center}
#gate .g{font-size:18vh;line-height:1;animation:bob 1.6s ease-in-out infinite}
#cake{font-size:22vh;line-height:1;position:relative;cursor:pointer}
#fl{position:absolute;left:50%;top:-6vh;transform:translateX(-50%);font-size:7vh;transition:opacity .4s;animation:flick .4s infinite alternate}
@keyframes flick{to{transform:translateX(-50%) scale(1.15) rotate(5deg)}}
#fin{display:none;flex-direction:column;align-items:center;gap:2vh}
#fin.show{display:flex;animation-delay:0s}
.sig{font-family:Pacifico,cursive;font-size:22px!important}
.f{position:absolute;bottom:-10%;z-index:2;pointer-events:none;opacity:.5;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-120vh) rotate(40deg)}}
#c{position:fixed;inset:0;pointer-events:none;z-index:20}
.row{display:flex;gap:14px;align-items:center}
.alt{background:#fff;color:var(--ink)}
#yes{font-size:20px;padding:16px 36px}
.pol{background:#fff;padding:14px 14px 10px;border-radius:6px;box-shadow:6px 6px 0 var(--sh);width:min(var(--w,78%),var(--mw,310px))}
.pol img,.ph{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 25%;max-height:46vh;border-radius:3px;background:#eee}
.pol img{display:block}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11vh;color:#777}
.ph small{font-size:13px;font-weight:500}
.pol span{display:block;margin-top:10px;font-family:Pacifico,cursive;color:var(--ink);font-size:18px}
.tears{position:absolute;inset:0;pointer-events:none}
.slide.on>.tears{animation-delay:0s}
.tears i{position:absolute;top:-8%;font-style:normal;font-size:22px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh)}}
.nav{position:absolute;bottom:4vh;left:0;right:0;display:flex;justify-content:center;gap:12px}
.slide.on>.nav{animation-delay:1.2s}
.nav button{padding:12px 26px;font-size:16px}
.nav .bk{background:rgba(0,0,0,.18);color:var(--fg);box-shadow:none}
@media(prefers-reduced-motion:reduce){.f,.tears{display:none}.slide.on>.e,#gate .g{animation:up .7s forwards}}
</style>
</head>
<body>
<div id="app">
  <div id="gate" style="--bg:#ffd23f;--fg:#1a0b2e">
    <div class="g">🎁</div>
    <h2>Hey <span id="gn"></span> 👀</h2>
    <p>Someone made something just for you</p>
    <button>Tap to open</button>
  </div>
  <div id="bars"></div>
  <button id="mute">🔊</button>
</div>
<canvas id="c"></canvas>

  ],
  letter:{title:"A little message for you",lines:["Thank you for being my person, bedi.","I hope this year gives you everything you deserve.","Don’t forget: I’m always one call away."]},
  slides:[
    {emoji:"💌",title:"Before anything else…",lines:["I made this just for you, Aruuu.","No template, no copy-paste. Just me and way too much free time."]},
    {emoji:"✨",title:"Why you’re the best",lines:["You make boring days feel like movies.","You’re the only one who gets my jokes.","You show up. Every single time."]},
    {emoji:"📸",title:"Our greatest hits",lines:["Every plan that went completely off-script.","Every late-night message that turned into 3 AM.","Every “I’m fine” you saw right through."]},
    {emoji:"🔮",title:"Your birthday forecast",lines:["100% chance of cake 🍰","90% chance of me being too loud","0% chance of a boring day"]}
  ],
  wish:"May this year be kinder, louder and way more fun than the last.",
  closing:"I’m so lucky to have you, Saima. Happy birthday! 💖"
};
/* ========================================== */
const $=id=>document.getElementById(id);
const INK='#1a0b2e',PAL=['#ffd23f','#3ddc97','#4cc9f0','#ff9f43'];
let ctx,muted=false,cur=-1,tm,P=[];
document.title='A surprise for '+CONFIG.name;$('gn').textContent=CONFIG.nick||CONFIG.name;

/* music-box "Happy Birthday" (public-domain melody) */
const N=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
function music(){if(!ctx||muted)return;let t=ctx.currentTime+.1;N.forEach(([f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain(),e=d*.42;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+e);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+e+.05);t+=e})}

/* confetti */
const cv=$('c'),x=cv.getContext('2d');
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function burst(n){for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:6+Math.random()*7,c:`hsl(${Math.random()*360} 95% 58%)`,r:Math.random()*6,l:140})}
(function loop(){x.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});requestAnimationFrame(loop)})();

/* slides */
const app=$('app'),bars=$('bars');
const S=[{t:'count',bg:INK,fg:'#fff',sh:'#ff4d8d'},{t:'hb',bg:'#ff4d8d'},...CONFIG.slides.map((s,i)=>({t:'txt',bg:PAL[i%4],...s})),{t:'cake',bg:INK,fg:'#fff',sh:'#ff4d8d',lock:1},{t:'ask',bg:'#ffd23f',lock:1},{t:'cry',bg:'#3b5b92',fg:'#fff',lock:1},...CONFIG.photos.map((p,i)=>({t:'pic',bg:PAL[(i+1)%4],r:i%2?3:-3,...p})),{t:'txt',bg:'#ffd23f',emoji:'💌',...CONFIG.letter},{t:'end',bg:'#ff4d8d'}];
const I=t=>S.findIndex(s=>s.t==t);S[I('cry')+1].nb=1;
let blown=0,no=0,MP=0;
const dur=s=>s.t=='count'?3200:0;
const T={
  cake:()=>`<h2>Make a wish 🤫</h2><div id="cake">🎂<b id="fl">🔥</b></div><p id="hint">Tap the cake to blow out the candle</p><div id="fin"><p>${CONFIG.wish}</p></div>`,
  ask:()=>`<div class="e">🎁</div><h2>One more thing…</h2><p>${CONFIG.ask}</p><div class="row"><button id="yes">YES 🎁</button><button id="no" class="alt">NO</button></div>`,
  cry:()=>`<div class="e">😭</div><h2 id="crytxt"></h2><button id="again">Try again ↺</button><div class="tears"></div>`,
  pic:s=>`${s.title?`<h2>${s.title}</h2>`:''}<div class="pol" style="rotate:${s.r}deg;--w:${s.w||'78%'};--mw:${s.mw||'310px'}">${s.src?`<img src="${s.src}" alt="" style="aspect-ratio:${s.ar||'4/5'}">`:'<div class="ph">📸<small>Your photo goes here</small></div>'}<span>${s.cap||''}</span></div>${s.msg?`<p>${s.msg}</p>`:''}`,
  end:()=>`<div class="e">💖</div><h2>${CONFIG.closing}</h2><p class="sig">— ${CONFIG.from}</p><button id="re">Replay ↺</button>`
};
const slides=S.map(s=>{
  const d=document.createElement('section');
  d.className='slide '+s.t;
  d.style.cssText=`--bg:${s.bg};--fg:${s.fg||INK};--sh:${s.sh||INK}`;
  d.innerHTML=T[s.t]?T[s.t](s):
    s.t=='count'?'<div class="n">3</div><div class="n">2</div><div class="n">1</div>':
    s.t=='hb'?`<div class="e">🎉</div><h2>Happy birthday</h2><h1>${CONFIG.name}</h1><p>a.k.a. ${CONFIG.nick} 😌</p>`:
    s.t=='cake'?`<h2>Make a wish 🤫</h2><div id="cake">🎂<b id="fl">🔥</b></div><p id="hint">Tap the cake to blow out the candle</p><div id="fin"><p>${CONFIG.wish}</p><p>${CONFIG.closing}</p><p class="sig">— ${CONFIG.from}</p><button id="re">Replay ↺</button></div>`:
    `<div class="e">${s.emoji||'✨'}</div><h2>${s.title}</h2>`+s.lines.map(l=>`<p>${l}</p>`).join('');
  if(['hb','txt','pic','cake'].includes(s.t))d.insertAdjacentHTML('beforeend',`<div class="nav"${s.t=='cake'?' id="cnav" style="display:none"':''}>${s.t=='hb'||s.nb?'':'<button class="bk" data-nav="-1">←</button>'}<button data-nav="1">Next →</button></div>`);
  [...d.children].forEach((c,j)=>c.style.setProperty('--i',j));
  app.appendChild(d);
  const b=bars.appendChild(document.createElement('b'));b.appendChild(document.createElement('i'));if(s.t=='cry')b.style.display='none';
  return d;
});
slides[I('cry')].querySelector('.tears').innerHTML=Array.from({length:16},()=>`<i style="left:${Math.random()*95}%;animation-duration:${2+Math.random()*2.5}s;animation-delay:-${Math.random()*3}s">💧</i>`).join('');
for(let i=0;i<14;i++){const f=document.createElement('span');f.className='f';f.textContent=['🎈','✨','💖','🎉','🌸','⭐'][i%6];f.style.cssText=`left:${Math.random()*95}%;font-size:${16+Math.random()*22}px;animation-duration:${7+Math.random()*8}s;animation-delay:-${Math.random()*10}s`;app.appendChild(f)}

function go(i){
  clearTimeout(tm);
  if(i<0)i=0;if(i>=S.length)return;
  cur=i;
  const s=S[i],n=dur(s);
  [...bars.children].forEach((b,j)=>{b.className=j<i||(j==i&&!n)?'done':j==i?'act':'';b.style.setProperty('--d',n+'ms')});
  slides.forEach((d,j)=>d.classList.toggle('on',j==i));
  if(s.t=='hb'){burst(180);if(!MP){MP=1;music()}}if(s.t=='end')burst(200);if(s.t=='cry')$('crytxt').textContent=CONFIG.cry[no++%CONFIG.cry.length];
  if(n)tm=setTimeout(()=>go(i+1),n);
}
function blow(){if(blown)return;blown=1;$('fl').style.opacity=0;$('hint').style.display='none';$('fin').classList.add('show');S[cur].lock=0;burst(220);setTimeout(()=>burst(160),500);$('cnav').style.display='flex'}

$('cake').onclick=blow;
$('re').onclick=()=>{blown=0;no=0;$('fl').style.opacity=1;$('hint').style.display='';$('fin').classList.remove('show');$('cnav').style.display='none';MP=0;go(0)};
$('yes').onclick=()=>{burst(250);go(I('cry')+1)};$('no').onclick=()=>go(I('cry'));$('again').onclick=()=>go(I('ask'));
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(ctx)muted?ctx.suspend():ctx.resume()};
$('gate').onclick=()=>{try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}$('gate').remove();$('mute').style.display='block';go(0)};
app.onclick=e=>{const b=e.target.closest('[data-nav]');if(b)go(cur+ +b.dataset.nav)};
</script>
</body>
</html>
